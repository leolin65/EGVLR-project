task: mmad_info

dataset_path: json

dataset_kwargs:
  data_files:
    test: ./eval_data/mmad256_test_info.json

test_split: test

output_type: generate_until

doc_to_visual: !function utils.mmad_doc_to_visual
doc_to_text: !function utils.mmad_doc_to_text
doc_to_target: "answer"

generation_kwargs:
  max_new_tokens: 128
  temperature: 0
  top_p: 1.0
  do_sample: false

process_results: !function utils.mmad_process_results

metric_list:

  - metric: object_acc
    aggregation: !function utils.object_acc
    higher_is_better: true

  - metric: detection_acc
    aggregation: !function utils.detection_acc
    higher_is_better: true

  - metric: location_iou
    aggregation: !function utils.location_iou
    higher_is_better: true

  - metric: exact_match
    aggregation: !function utils.exact_match
    higher_is_better: true

lmms_eval_specific_kwargs:
  default:
    post_prompt: ""

metadata:
  - version: 0.1